name: 🚀 CI - Continuous Integration

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * 1'  # Weekly on Monday 2 AM UTC

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '22'
  PYTORCH_VERSION: '2.4'
  CUDA_VERSION: 'cu124'

jobs:
  # ========================================================================
  # CODE QUALITY & STATIC ANALYSIS
  # ========================================================================
  code-quality:
    name: 🔍 Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-web.txt
            requirements-dev.txt

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: 🎨 Run Ruff (lint + format)
        run: |
          ruff check scripts/ web/backend/ --output-format=github
          ruff format --check scripts/ web/backend/

      - name: 🔬 Run MyPy (type checking)
        run: |
          mypy scripts/ web/backend/ --strict --ignore-missing-imports --show-error-codes

      - name: 🔒 Run Bandit (security)
        run: |
          bandit -r scripts/ web/backend/ -f json -o bandit-report.json || true
          bandit -r scripts/ web/backend/ -ll

      - name: 📋 Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 30

  # ========================================================================
  # PYTHON TESTS (UNIT + INTEGRATION)
  # ========================================================================
  python-tests:
    name: 🧪 Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
        include:
          - python-version: '3.11'
            pytorch-variant: 'cpu'
            label: 'CPU (default)'
          - python-version: '3.11'
            pytorch-variant: 'cu124'
            label: 'CUDA 12.4'
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-web.txt

      - name: 📦 Install PyTorch (${{ matrix.pytorch-variant }})
        run: |
          if [ "${{ matrix.pytorch-variant }}" = "cu124" ]; then
            pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu124
          else
            pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          fi

      - name: 📦 Install project dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-web.txt
          pip install pytest pytest-cov pytest-xdist pytest-timeout

      - name: 🧪 Run Python tests
        run: |
          python -m pytest \
            --cov=scripts \
            --cov=web/backend \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            -v \
            --timeout=120 \
            -x \
            tests/ web/backend/tests/

      - name: 📊 Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: python-${{ matrix.python-version }}-${{ matrix.pytorch-variant }}
          name: python-coverage-${{ matrix.python-version }}-${{ matrix.pytorch-variant }}

  # ========================================================================
  # FRONTEND TESTS & BUILD
  # ========================================================================
  frontend:
    name: 🌐 Frontend (React + Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/frontend/package-lock.json

      - name: 📦 Install dependencies
        working-directory: web/frontend
        run: npm ci --no-audit --no-fund

      - name: 🔍 Run ESLint
        working-directory: web/frontend
        run: npm run lint

      - name: 🧪 Run tests
        working-directory: web/frontend
        run: npm test -- --run --reporter=verbose

      - name: 🏗️ Build production
        working-directory: web/frontend
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8000

      - name: 📦 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web/frontend/dist/
          retention-days: 7

  # ========================================================================
  # MODEL VALIDATION TESTS
  # ========================================================================
  model-validation:
    name: 🤖 Model Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: 🏗️ Build model
        run: |
          python scripts/02_build_model.py
        timeout-minutes: 5

      - name: 🔍 Verify model architecture
        run: |
          python -c "
          import torch
          from scripts.02_build_model import GPT, GPTConfig
          
          config = GPTConfig()
          model = GPT(config)
          
          # Check parameter count
          total_params = sum(p.numel() for p in model.parameters())
          trainable_params = sum(p.numel() for p in model.parameters() if p.requires_grad)
          
          print(f'Total parameters: {total_params:,}')
          print(f'Trainable parameters: {trainable_params:,}')
          
          # Verify ~124M params
          assert 120_000_000 < total_params < 130_000_000, f'Expected ~124M params, got {total_params:,}'
          
          # Test forward pass
          x = torch.randint(0, config.vocab_size, (2, 128))
          logits, loss = model(x, x)
          print(f'Forward pass: logits shape {logits.shape}')
          
          # Test KV-cache
          model.eval()
          with torch.no_grad():
              _ = model(x[:, :1])
              for i in range(1, 10):
                  _ = model(x[:, i:i+1], kv_cache=model.transformer.h[0].attn.kv_cache)
          print('KV-cache test passed')
          "

      - name: ⚡ Quick training step test
        run: |
          python -c "
          import torch
          from scripts.02_build_model import GPT, GPTConfig
          from torch.optim import AdamW
          
          config = GPTConfig()
          model = GPT(config)
          optimizer = AdamW(model.parameters(), lr=1e-4)
          
          # Single training step
          model.train()
          x = torch.randint(0, config.vocab_size, (2, 64))
          logits, loss = model(x, x)
          loss.backward()
          optimizer.step()
          print(f'Training step loss: {loss.item():.4f}')
          "

  # ========================================================================
  # DOCKER BUILD TEST
  # ========================================================================
  docker-build:
    name: 🐳 Docker Build Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [code-quality, python-tests, frontend]
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build training image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: train
          load: true
          tags: ragnarok-ai/train:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🏗️ Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          load: true
          tags: ragnarok-ai/api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🧪 Test API image
        run: |
          docker run --rm -d --name test-api -p 8000:8000 ragnarok-ai/api:test
          sleep 10
          curl -f http://localhost:8000/api/health
          docker stop test-api

      - name: 🧪 Test Docker Compose
        run: |
          docker compose config -q
          echo "Docker Compose configuration is valid"

  # ========================================================================
  # DEPENDENCY SECURITY SCAN
  # ========================================================================
  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🔍 Run pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt -r requirements-web.txt -r requirements-dev.txt --format=json --output=pip-audit-report.json || true
          pip-audit -r requirements.txt -r requirements-web.txt -r requirements-dev.txt

      - name: 📋 Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          retention-days: 30

      - name: 🔍 Run npm audit
        working-directory: web/frontend
        run: npm audit --audit-level=high || true

      - name: 🐳 Trivy container scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: 📋 Upload Trivy results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  # ========================================================================
  # DOCUMENTATION CHECK
  # ========================================================================
  docs-check:
    name: 📚 Documentation Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ✅ Check required docs exist
        run: |
          required_files=(
            "README.md"
            ".docs/PRD.md"
            ".docs/ARCHITECTURE.md"
            ".docs/RULES.md"
            ".docs/DESIGN.md"
            ".docs/TASKS.md"
            ".docs/MEMORY.md"
          )
          
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing required file: $file"
              exit 1
            fi
            echo "✅ Found: $file"
          done

      - name: 🔗 Check internal links
        run: |
          pip install markdown-link-check
          markdown-link-check README.md --config .markdown-link-check.json || true

  # ========================================================================
  # SUMMARY & STATUS
  # ========================================================================
  ci-summary:
    name: ✅ CI Summary
    runs-on: ubuntu-latest
    needs: 
      - code-quality
      - python-tests
      - frontend
      - model-validation
      - docker-build
      - security-scan
      - docs-check
    if: always()
    timeout-minutes: 5
    steps:
      - name: 📊 Check job statuses
        run: |
          echo "## CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          jobs=("code-quality" "python-tests" "frontend" "model-validation" "docker-build" "security-scan" "docs-check")
          
          all_passed=true
          for job in "${jobs[@]}"; do
            result="${{ needs.$job.result }}"
            if [ "$result" = "success" ]; then
              echo "✅ $job: **PASSED**" >> $GITHUB_STEP_SUMMARY
            elif [ "$result" = "failure" ]; then
              echo "❌ $job: **FAILED**" >> $GITHUB_STEP_SUMMARY
              all_passed=false
            elif [ "$result" = "cancelled" ]; then
              echo "⚠️ $job: **CANCELLED**" >> $GITHUB_STEP_SUMMARY
            else
              echo "⏭️ $job: **SKIPPED**" >> $GITHUB_STEP_SUMMARY
            fi
          done
          
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$all_passed" = "true" ]; then
            echo "🎉 **All checks passed!**" >> $GITHUB_STEP_SUMMARY
            exit 0
          else
            echo "💥 **Some checks failed!**" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi